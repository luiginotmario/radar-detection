[package]
name = "radar-detection"
version = "0.1.0"
edition = "2024"
description = "a little radar that shows where people are, even behind a wall"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tokio-serial = "5.4"

[profile.release]
lto = true
strip = true
codegen-units = 1
